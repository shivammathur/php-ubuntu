name: Release PHP Ubuntu from private R2

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: PHP minor version
        required: true
        type: string
      build-id:
        description: Signed php-ubuntu/builds/run-attempt
        required: true
        type: string
      release-version:
        description: Exact announced version
        required: true
        type: string
      source-sha256:
        description: Official SHA-256 for the staged tar.gz or tar.xz
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: php-ubuntu-publication
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify approval, announced source and package bytes
        env:
          PRIVATE_BUILD_ID: ${{ inputs.build-id }}
          PHP_VERSION: ${{ inputs.php-version }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          SOURCE_SHA256: ${{ inputs.source-sha256 }}
          PRIVATE_R2_ENDPOINT: ${{ secrets.PRIVATE_R2_ENDPOINT }}
          PRIVATE_R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          PRIVATE_R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
          PRIVATE_RELEASE_SIGNING_KEY: ${{ secrets.PRIVATE_RELEASE_SIGNING_KEY }}
        run: python3 scripts/private/stage.py release
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install --upgrade cloudsmith-cli
      - name: Publish tested caches and installer
        env:
          SETUP_PHP_AWS_S3_ENDPOINT: ${{ secrets.SETUP_PHP_AWS_S3_ENDPOINT }}
          SETUP_PHP_AWS_ACCESS_KEY_ID: ${{ secrets.SETUP_PHP_AWS_ACCESS_KEY_ID }}
          SETUP_PHP_AWS_SECRET_ACCESS_KEY: ${{ secrets.SETUP_PHP_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_CACHE_ZONE: ${{ secrets.CF_CACHE_ZONE }}
          CF_CACHE_KEY: ${{ secrets.CF_CACHE_KEY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          PHP_PRIVATE_RELEASE_VERSION: ${{ inputs.release-version }}
          GITHUB_MESSAGE: ''
          GITHUB_TOKEN: ${{ github.token }}
        run: bash -e scripts/release.sh
