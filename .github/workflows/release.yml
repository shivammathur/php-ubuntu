name: Publish approved PHP archives to GitHub
run-name: Publish PHP ${{ inputs.minor }} ${{ inputs.ticket }}
on:
  push:
    branches: [feature/oct-security-publication-20261021]
  workflow_dispatch:
    inputs:
      minor:
        type: choice
        required: true
        options: ['7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
      ticket:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: oct-security-publication-${{ github.repository }}-${{ inputs.minor }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: ${{ format('oct-publication-20261021-{0}', inputs.minor) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Publish exact approved package bytes
        env:
          MINOR: ${{ inputs.minor }}
          GH_TOKEN: ${{ github.token }}
          PRIVATE_PACKAGE_ACCESS: ${{ secrets.PRIVATE_PACKAGE_ACCESS }}
        run: python3 publication/publish.py "$MINOR"
      - name: Preserve per-file receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ inputs.minor }}-${{ github.run_attempt }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 90
