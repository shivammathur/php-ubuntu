name: Recover audited Brotli cache publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    name: Publish PHP ${{ matrix.php }} mirrors
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install boto3 requests cloudsmith-cli
      - name: Publish verified cache bytes
        run: python publication/brotli-20261024/recover.py publish "$PHP_MINOR"
        env:
          PHP_MINOR: ${{ matrix.php }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SETUP_PHP_AWS_S3_ENDPOINT: ${{ secrets.SETUP_PHP_AWS_S3_ENDPOINT }}
          SETUP_PHP_AWS_ACCESS_KEY_ID: ${{ secrets.SETUP_PHP_AWS_ACCESS_KEY_ID }}
          SETUP_PHP_AWS_SECRET_ACCESS_KEY: ${{ secrets.SETUP_PHP_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-receipt-${{ matrix.php }}
          path: receipts/
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.php == '5.6' || matrix.php == '7.0' || matrix.php == '7.1' || matrix.php == '7.2'
        with:
          name: corrected-cache-aliases-${{ matrix.php }}
          path: corrected/
          overwrite: true
          if-no-files-found: error
  finalize:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install boto3 requests cloudsmith-cli
      - uses: actions/download-artifact@v4
        with:
          pattern: publication-receipt-*
          path: input-receipts
      - name: Finalize metadata and remove malformed aliases
        run: python publication/brotli-20261024/recover.py finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SETUP_PHP_AWS_S3_ENDPOINT: ${{ secrets.SETUP_PHP_AWS_S3_ENDPOINT }}
          SETUP_PHP_AWS_ACCESS_KEY_ID: ${{ secrets.SETUP_PHP_AWS_ACCESS_KEY_ID }}
          SETUP_PHP_AWS_SECRET_ACCESS_KEY: ${{ secrets.SETUP_PHP_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CF_CACHE_ZONE: ${{ secrets.CF_CACHE_ZONE }}
          CF_CACHE_KEY: ${{ secrets.CF_CACHE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-finalization
          path: receipts/
          overwrite: true
          if-no-files-found: error
  verify:
    name: Verify PHP ${{ matrix.php }} public downloads
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        php: ['5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6', '8.7']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install boto3 requests
      - name: Verify GitHub digests and all three public mirrors
        run: python publication/brotli-20261024/recover.py verify "$PHP_MINOR"
        env:
          PHP_MINOR: ${{ matrix.php }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ matrix.php }}
          path: receipts/
          overwrite: true
          if-no-files-found: error
